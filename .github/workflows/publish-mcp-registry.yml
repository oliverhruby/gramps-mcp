name: Publish to MCP Registry

# Publishes the server.json metadata to the MCP Registry (registry.modelcontextprotocol.io).
# Uses GitHub OIDC authentication (namespace: io.github.oliverhruby/*).
# Runs after a version tag is pushed (same trigger as PyPI/Docker publish).
# Requires: mcp-publisher CLI (installed from GitHub releases).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC authentication to MCP Registry
  contents: read

jobs:
  publish-mcp-registry:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package version
        run: python scripts/check_tag_matches_version.py

      - name: Extract version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not m:
              raise SystemExit('version not found in pyproject.toml')
          print(m.group(1))
          PY
          )
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_${ARCH}.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Update server.json version
        run: |
          python - <<'PY'
          import json, re, pathlib
          p = pathlib.Path('server.json')
          data = json.loads(p.read_text())
          data['version'] = '${{ steps.version.outputs.value }}'
          # Update package version too
          for pkg in data.get('packages', []):
              pkg['version'] = '${{ steps.version.outputs.value }}'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Wait for package version on PyPI
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # The MCP Registry validates that the PyPI package version referenced by
          # server.json already exists. On a tag push this job races the PyPI
          # publish workflow, so poll until the release is indexed (bounded).
          URL="https://pypi.org/pypi/gramps-mcp-full/${VERSION}/json"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "PyPI release ${VERSION} is available after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}/20: ${URL} returned HTTP ${code}; retrying in 15s..."
            sleep 15
          done
          echo "::error::PyPI release gramps-mcp-full ${VERSION} not found after 20 attempts (~5 min). ${URL} still not returning 200."
          exit 1

      - name: Login to MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        shell: bash
        run: |
          set -euo pipefail
          # The registry-side PyPI check can still lag briefly after indexing, so
          # retry the publish itself instead of failing the whole release.
          for attempt in $(seq 1 5); do
            if mcp-publisher publish server.json; then
              echo "Published to MCP Registry on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/5: publish failed; retrying in 30s..."
            sleep 30
          done
          echo "::error::mcp-publisher publish server.json failed after 5 attempts."
          exit 1