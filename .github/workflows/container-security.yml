name: Container Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t gramps-mcp:ci .

      - name: Run Trivy gate scan (HIGH/CRITICAL)
        id: trivy_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gramps-mcp:ci
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

      - name: Run Trivy SARIF scan (all severities)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gramps-mcp:ci
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 0

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce HIGH/CRITICAL gate
        if: steps.trivy_gate.outcome == 'failure'
        run: |
          echo "Trivy gate failed: HIGH/CRITICAL vulnerability detected."
          exit 1
