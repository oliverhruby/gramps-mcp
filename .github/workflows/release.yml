name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integration:
    uses: ./.github/workflows/integration.yml
    with:
      grampsweb-image: ghcr.io/gramps-project/grampsweb:latest

  create-release:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release with autogenerated notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
